[project]
name = "aircraft-in-the-air-spaces-of-countries"
version = "0.1.0"
description = "Программа, которая собирает данные о самолетах в воздушных пространствах тех стран, которые вы выберете"
authors = [
    {name = "даша рамзер",email = "kda2000.123@yandex.ru"}
]
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "requests-mock (>=1.12.1,<2.0.0)"
]

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
check_untyped_defs = true
strict = true
warn_unreachable = true


[tool.black]
line-length = 119
exclude = ".git"


[tool.isort]
line_length = 119